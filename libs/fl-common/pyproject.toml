[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-common"
version = "0.1.0"
description = "Shared model, feature schema and update metadata for CSC3104-honeypot-fl"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fl_common"]
