[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-common"
version = "0.1.0"
description = "Shared model, feature schema and update metadata for CSC3104-honeypot-fl"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fl_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
