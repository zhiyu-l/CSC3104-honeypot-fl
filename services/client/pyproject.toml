[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-client"
version = "0.1.0"
description = "Flower ClientApp: trains the shared model on one org's local sessions"
requires-python = ">=3.10"
dependencies = [
    "fl-common",
    "flwr>=1.40.0,<1.41.0",
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fl_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
