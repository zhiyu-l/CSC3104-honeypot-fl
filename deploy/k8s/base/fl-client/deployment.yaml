# One SuperNode per organisation. It dials out to the shared coordinator
# (SUPERLINK_ADDRESS) and trains on that org's feature CSV only.
#
# Required ConfigMap `fl-client-settings` (from the overlay):
#   FL_ORG_ID          org-a | org-b | org-c   (UpdateMetadata client_id)
#   FL_ORG_INDEX       0 | 1 | 2
#   SUPERLINK_ADDRESS  host:port of the coordinator's Fleet API
#   AWS_DEFAULT_REGION, S3_BUCKET, S3_FEATURES_KEY   (S3 overlays only)
#   FL_BATCHES_URI     optional: s3://<bucket>/<org>/processed/sessions/
#   FL_EXCLUDE_URI     optional: replay selection file(s) of held-out test sessions
#
# Data (see services/client/src/fl_client/data.py):
#   - The init container copies the org's Kaggle base split,
#     s3://$S3_BUCKET/$S3_FEATURES_KEY (e.g. <org>/processed/base/train.csv),
#     to /data/train.csv once at pod start. It does not change between runs.
#   - At the start of EVERY training run the ClientApp also reads every completed
#     nightly batch under FL_BATCHES_URI, verifies it against its manifest and
#     caches it in /tmp/fl-cache, so new attacks are picked up without a restart.
#   - Sessions listed in FL_EXCLUDE_URI are never trained on.
#   The pod's role must be able to read the base key, the batches prefix and the
#   exclusion file, and nothing else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl-client
spec:
  replicas: 1                # never scale: one org = one Flower node
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: fl-client
  strategy:
    type: Recreate           # avoid two nodes for the same org during a rollout
  template:
    metadata:
      labels:
        app: fl-client
    spec:
      serviceAccountName: fl-client
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # `app` user created in services/client/Dockerfile
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: fetch-features
        image: public.ecr.aws/aws-cli/aws-cli:2.38.1
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - aws s3 cp "s3://${S3_BUCKET}/${S3_FEATURES_KEY}" /data/train.csv --only-show-errors
        envFrom:
        - configMapRef:
            name: fl-client-settings
        env:
        - name: HOME
          value: /tmp
        - name: AWS_EC2_METADATA_DISABLED
          value: 'true'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: train-data
          mountPath: /data
      containers:
      - name: supernode
        image: honeypot-fl-client
        imagePullPolicy: IfNotPresent
        args:
        - --insecure
        - --superlink=$(SUPERLINK_ADDRESS)
        - --host=127.0.0.1   # Runtime API is only used by the ClientApp subprocess
        - --port=9094
        - --isolation=subprocess
        - --health-server-address=0.0.0.0:8081
        envFrom:
        - configMapRef:
            name: fl-client-settings
        env:
        - name: FL_DATA_PATH
          value: /data/train.csv
        - name: FL_CACHE_DIR
          value: /tmp/fl-cache
        - name: HOME
          value: /tmp
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        startupProbe:
          grpc:
            port: 8081
          periodSeconds: 5
          failureThreshold: 24   # torch import can take a while on small nodes
        livenessProbe:
          grpc:
            port: 8081
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: train-data
          mountPath: /data
          readOnly: true
        - name: fl-cache
          mountPath: /tmp/fl-cache
      volumes:
      - name: train-data
        emptyDir:
          sizeLimit: 256Mi
      - name: fl-cache       # verified nightly batches; refilled from S3 if the pod restarts
        emptyDir:
          sizeLimit: 1Gi
