apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
spec:
  progressDeadlineSeconds: 600
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cowrie
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cowrie
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        image: cowrie/cowrie@sha256:019726c8deef20729162cda492d9385917b579c9ace6368e47e7566cd2491ba1
        imagePullPolicy: IfNotPresent
        name: cowrie
        ports:
        - containerPort: 2222
          name: ssh
          protocol: TCP
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /cowrie/cowrie-git/var/log/cowrie
          name: persistent-logs
          subPathExpr: $(POD_UID)
        - mountPath: /cowrie/cowrie-git/var/lib/cowrie/ssh_host_rsa_key
          name: host-keys
          readOnly: true
          subPath: ssh_host_rsa_key
        - mountPath: /cowrie/cowrie-git/var/lib/cowrie/ssh_host_ecdsa_key
          name: host-keys
          readOnly: true
          subPath: ssh_host_ecdsa_key
        - mountPath: /cowrie/cowrie-git/var/lib/cowrie/ssh_host_ed25519_key
          name: host-keys
          readOnly: true
          subPath: ssh_host_ed25519_key
        - mountPath: /cowrie/cowrie-git/var/lib/cowrie/ssh_host_rsa_key.pub
          name: host-keys
          readOnly: true
          subPath: ssh_host_rsa_key.pub
        - mountPath: /cowrie/cowrie-git/var/lib/cowrie/ssh_host_ecdsa_key.pub
          name: host-keys
          readOnly: true
          subPath: ssh_host_ecdsa_key.pub
        - mountPath: /cowrie/cowrie-git/var/lib/cowrie/ssh_host_ed25519_key.pub
          name: host-keys
          readOnly: true
          subPath: ssh_host_ed25519_key.pub
        - mountPath: /cowrie/cowrie-git/etc/cowrie.cfg
          name: config
          readOnly: true
          subPath: cowrie.cfg
        - mountPath: /cowrie/cowrie-git/etc/userdb.txt
          name: userdb
          readOnly: true
          subPath: userdb.txt
      dnsPolicy: ClusterFirst
      initContainers:
      - args:
        - mkdir -p "/efs/$POD_UID"
        command:
        - /bin/sh
        - -ec
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        name: prepare-log-directory
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /efs
          name: persistent-logs
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: persistent-logs
        persistentVolumeClaim:
          claimName: cowrie-logs
      - name: host-keys
        secret:
          defaultMode: 292
          secretName: cowrie-host-keys
      - configMap:
          defaultMode: 420
          name: cowrie-config
        name: config
      - name: userdb
        secret:
          defaultMode: 420
          secretName: cowrie-userdb
