apiVersion: batch/v1
kind: CronJob
metadata:
  name: cowrie-logs-to-s3
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {}
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 3
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - /bin/sh
            - /scripts/upload.sh
            env:
            - name: ORG
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['organisation']
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: cowrie-upload-settings
                  key: AWS_DEFAULT_REGION
            - name: AWS_EC2_METADATA_DISABLED
              value: 'true'
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: cowrie-upload-settings
                  key: S3_BUCKET
            image: public.ecr.aws/aws-cli/aws-cli:2.38.1
            imagePullPolicy: IfNotPresent
            name: uploader
            resources:
              limits:
                cpu: '1'
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /logs
              name: logs
              readOnly: true
            - name: upload-script
              mountPath: /scripts
              readOnly: true
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccountName: cowrie-log-uploader
          terminationGracePeriodSeconds: 30
          volumes:
          - name: logs
            persistentVolumeClaim:
              claimName: cowrie-logs
          - name: upload-script
            configMap:
              name: cowrie-upload-script
              defaultMode: 292
  schedule: 0 0 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  suspend: true
  timeZone: Asia/Singapore
