apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cowrie-logs
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
spec:
  template:
    spec:
      containers:
      - name: cowrie
        readinessProbe:
          tcpSocket:
            port: ssh
          initialDelaySeconds: 5
          periodSeconds: 5
      initContainers:
      - name: prepare-log-directory
        args:
        - mkdir -p "/efs/$POD_UID" && chown 999:999 "/efs/$POD_UID"
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
