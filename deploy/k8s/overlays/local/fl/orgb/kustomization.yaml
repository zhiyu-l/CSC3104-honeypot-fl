# FL client for orgb. Apply only to context kind-orgb-honeypot-cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fl
labels:
- pairs:
    organisation: orgb
  includeSelectors: false
  includeTemplates: true
resources:
- ../client
configMapGenerator:
- name: fl-client-settings
  literals:
  - FL_ORG_ID=org-b
  - FL_ORG_INDEX=1
  - SUPERLINK_ADDRESS=superlink:8000
