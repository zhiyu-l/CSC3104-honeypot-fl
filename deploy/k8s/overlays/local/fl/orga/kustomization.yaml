# FL client for orga. Apply only to context kind-orga-honeypot-cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fl
labels:
- pairs:
    organisation: orga
  includeSelectors: false
  includeTemplates: true
resources:
- ../client
configMapGenerator:
- name: fl-client-settings
  literals:
  - FL_ORG_ID=org-a
  - FL_ORG_INDEX=0
  - SUPERLINK_ADDRESS=superlink:8000
